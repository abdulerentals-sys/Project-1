<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b16">
  <meta name="description" content="Contact Abdul Ali for projects, collaborations, and conversations.">
  <title>Contact | Abdul Ali</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="aurora one" aria-hidden="true"></div>
  <div class="aurora two" aria-hidden="true"></div>

  <main class="card page-card" data-tilt>
    <div class="shine" aria-hidden="true"></div>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="abdul%20ali.html">Home</a>
      <a href="about.html">About</a>
      <a class="active" aria-current="page" href="contact.html">Contact</a>
    </nav>

    <section class="page-content">
      <div class="eyebrow"><span class="dot"></span> Start a conversation</div>
      <h1 class="page-title">Let’s build something<br>meaningful.</h1>
      <p class="lead">Have a project, collaboration, rental requirement, or research conversation in mind? Leave a note below.</p>

      <form class="contact-form" id="contact-form">
        <div class="form-row">
          <label>
            <span>Your name</span>
            <input type="text" name="name" autocomplete="name" placeholder="Your name" required>
          </label>
          <label>
            <span>Your email</span>
            <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
          </label>
        </div>
        <label>
          <span>Message</span>
          <textarea name="message" rows="4" placeholder="Tell me a little about what you have in mind…" required></textarea>
        </label>
        <div class="form-footer">
          <button class="button primary" type="submit">Send message</button>
          <p class="form-note">Demo form — ready to connect to your email or form service.</p>
        </div>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="theme.js"></script>
</body>
</html>
