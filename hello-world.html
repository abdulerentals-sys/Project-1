<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b16">
  <title>Hello World ✦</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f7ff;
      --muted: #b8b9cd;
      --purple: #8b5cf6;
      --pink: #ec4899;
      --cyan: #22d3ee;
      --surface: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.24), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(34, 211, 238, 0.16), transparent 30%),
        #090b16;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(circle at center, black, transparent 72%);
    }

    .aurora {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      pointer-events: none;
      animation: drift 11s ease-in-out infinite alternate;
    }

    .aurora.one {
      top: -160px;
      left: -100px;
      background: var(--purple);
    }

    .aurora.two {
      right: -160px;
      bottom: -150px;
      background: var(--cyan);
      animation-delay: -4s;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(760px, 100%);
      padding: clamp(44px, 8vw, 82px) clamp(24px, 7vw, 68px);
      overflow: hidden;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 34px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.035));
      box-shadow: 0 35px 90px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transition: transform 180ms ease-out;
      isolation: isolate;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -2px;
      z-index: -2;
      border-radius: inherit;
      background: conic-gradient(from 180deg, transparent 10%, rgba(34, 211, 238, 0.5), rgba(139, 92, 246, 0.5), rgba(236, 72, 153, 0.42), transparent 72%);
      filter: blur(24px);
      opacity: 0.32;
      animation: hue-spin 9s linear infinite;
    }

    .shine {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, 0.16), transparent 26%);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 8px 13px;
      color: #d9d5ff;
      border: 1px solid rgba(167, 139, 250, 0.24);
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.11);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #67e8f9;
      box-shadow: 0 0 14px #22d3ee;
      animation: pulse 1.8s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.6rem, 12vw, 7.5rem);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.07em;
      background: linear-gradient(100deg, #ffffff 8%, #b9a4ff 39%, #67e8f9 67%, #f9a8d4 92%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 5s linear infinite;
    }

    .subtitle {
      max-width: 530px;
      margin: 26px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.3vw, 1.16rem);
      line-height: 1.7;
    }

    .sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .sparkle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.9);
      animation: twinkle 2.6s ease-in-out infinite;
    }

    .sparkle:nth-child(1) { top: 17%; left: 10%; animation-delay: -0.5s; }
    .sparkle:nth-child(2) { top: 26%; right: 12%; animation-delay: -1.4s; }
    .sparkle:nth-child(3) { bottom: 20%; left: 16%; animation-delay: -2s; }
    .sparkle:nth-child(4) { right: 17%; bottom: 16%; animation-delay: -0.8s; }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    @keyframes drift {
      to { transform: translate3d(55px, 30px, 0) scale(1.14); }
    }

    @keyframes hue-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      50% { transform: scale(1.4); opacity: 0.68; }
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(0.5); opacity: 0.25; }
      50% { transform: scale(1.35); opacity: 1; }
    }

    @media (max-width: 520px) {
      .card { border-radius: 26px; }
      .subtitle { line-height: 1.55; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      .card { transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="aurora one" aria-hidden="true"></div>
  <div class="aurora two" aria-hidden="true"></div>

  <main class="card" id="hello-card">
    <div class="shine" aria-hidden="true"></div>
    <div class="sparkles" aria-hidden="true">
      <span class="sparkle"></span>
      <span class="sparkle"></span>
      <span class="sparkle"></span>
      <span class="sparkle"></span>
    </div>

    <div class="eyebrow"><span class="dot"></span> First signal received</div>
    <h1>Hello<br>World.</h1>
    <p class="subtitle">A tiny page with a little extra glow — built to make the very first words on the web feel special.</p>
  </main>

  <script>
    const card = document.querySelector('#hello-card');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!reduceMotion) {
      card.addEventListener('pointermove', (event) => {
        const box = card.getBoundingClientRect();
        const x = (event.clientX - box.left) / box.width;
        const y = (event.clientY - box.top) / box.height;

        card.style.setProperty('--rx', `${(0.5 - y) * 5}deg`);
        card.style.setProperty('--ry', `${(x - 0.5) * 7}deg`);
        card.style.setProperty('--mx', `${x * 100}%`);
        card.style.setProperty('--my', `${y * 100}%`);
      });

      card.addEventListener('pointerleave', () => {
        card.style.setProperty('--rx', '0deg');
        card.style.setProperty('--ry', '0deg');
        card.style.setProperty('--mx', '50%');
        card.style.setProperty('--my', '50%');
      });
    }
  </script>
</body>
</html>
